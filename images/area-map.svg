<svg class="area-map" viewBox="0 0 900 780" role="img" aria-labelledby="mapTitle mapDesc" xmlns="http://www.w3.org/2000/svg">
  <title id="mapTitle">Illustrated map of Altafulla and Castell de Tamarit</title>
  <desc id="mapDesc">A detailed hand-drawn map of the coast from La Mora and Castell de Tamarit in the west, through Les Botigues, to Altafulla old town and its beach with the hotels.</desc>

  <rect width="900" height="780" fill="#fffaf0"/>

  <!-- ================= SEA (top-right to bottom) ================= -->
  <path d="M0,470 C90,452 150,486 220,470 C290,454 340,420 420,410
           C520,398 600,360 700,330 C790,304 850,292 900,282
           L900,780 L0,780 Z" fill="#e8f0ec"/>
  <path d="M0,470 C90,452 150,486 220,470 C290,454 340,420 420,410
           C520,398 600,360 700,330 C790,304 850,292 900,282"
        fill="none" stroke="#3b2f26" stroke-width="2.2" stroke-linecap="round"/>

  <!-- sand -->
  <path d="M0,470 C90,452 150,486 220,470 C290,454 340,420 420,410
           C520,398 600,360 700,330 C790,304 850,292 900,282
           L900,258 C850,270 792,282 702,308 C602,338 522,376 420,388
           C340,398 288,432 218,448 C148,464 88,430 0,448 Z"
        fill="#f3e7cd"/>
  <path d="M0,470 C90,452 150,486 220,470 C290,454 340,420 420,410
           C520,398 600,360 700,330 C790,304 850,292 900,282"
        fill="none" stroke="#3b2f26" stroke-width="1.4" stroke-linecap="round" opacity=".5"/>

  <!-- waves -->
  <g stroke="#7ea39d" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".8">
    <path d="M96,530 q12,-9 24,0 q12,9 24,0"/>
    <path d="M210,600 q12,-9 24,0 q12,9 24,0"/>
    <path d="M140,668 q12,-9 24,0 q12,9 24,0"/>
    <path d="M330,650 q12,-9 24,0 q12,9 24,0"/>
    <path d="M470,700 q12,-9 24,0 q12,9 24,0"/>
    <path d="M580,580 q12,-9 24,0 q12,9 24,0"/>
    <path d="M700,610 q12,-9 24,0 q12,9 24,0"/>
    <path d="M780,500 q12,-9 24,0 q12,9 24,0"/>
    <path d="M840,420 q12,-9 24,0 q12,9 24,0"/>
    <path d="M380,540 q12,-9 24,0 q12,9 24,0"/>
  </g>

  <!-- sailboat -->
  <g class="doodle" stroke="#3b2f26" stroke-width="1.7" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M700,500 v-52 l34,34 z" fill="#fffaf0"/>
    <path d="M700,500 v-52 l-22,34 z" fill="#f6efdd"/>
    <path d="M668,504 h66 l-11,16 h-44 z" fill="#e8d9b8"/>
    <path d="M700,448 v-10"/>
  </g>
  <!-- second boat -->
  <g class="doodle" stroke="#3b2f26" stroke-width="1.5" fill="#f6efdd" stroke-linejoin="round">
    <path d="M540,660 h40 l-7,11 h-26 z"/>
    <path d="M556,660 v-22 l16,16 z"/>
  </g>

  <!-- fish -->
  <g class="doodle" stroke="#7ea39d" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".85">
    <path d="M160,730 q13,-10 26,0 q-13,10 -26,0 z M186,730 l9,-7 v14 z"/>
    <path d="M660,712 q12,-9 24,0 q-12,9 -24,0 z M684,712 l8,-6 v12 z"/>
  </g>

  <text x="470" y="756" class="map-water" text-anchor="middle">MEDITERRANEAN SEA</text>

  <!-- ================= COAST ROAD ================= -->
  <path d="M-10,436 C90,420 150,452 220,438 C290,424 340,392 420,380
           C520,368 600,332 700,302 C790,276 852,264 910,254"
        fill="none" stroke="#a08d70" stroke-width="2.4"
        stroke-dasharray="11 10" stroke-linecap="round" opacity=".9"/>

  <!-- ================= PINE FOREST (Tamarit) ================= -->
  <g class="doodle" stroke="#4e6b4a" stroke-width="1.6" fill="#dfe7d6" stroke-linejoin="round">
    <path d="M60,392 l14,-30 l14,30 z"/><path d="M64,374 l10,-22 l10,22 z"/>
    <path d="M104,404 l12,-26 l12,26 z"/><path d="M107,388 l9,-19 l9,19 z"/>
    <path d="M142,396 l13,-28 l13,28 z"/><path d="M145,379 l10,-20 l10,20 z"/>
    <path d="M178,414 l11,-24 l11,24 z"/><path d="M181,399 l8,-17 l8,17 z"/>
    <path d="M46,436 l10,-22 l10,22 z"/>
    <path d="M124,440 l11,-24 l11,24 z"/><path d="M127,425 l8,-17 l8,17 z"/>
    <path d="M210,430 l10,-22 l10,22 z"/>
  </g>
  <g stroke="#4e6b4a" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M74,392 v16 M116,404 v14 M155,396 v16 M189,414 v14 M56,436 v12 M135,440 v14 M220,430 v12"/>
  </g>
  <text x="120" y="368" class="map-label-sm" text-anchor="middle">PINE FOREST</text>

  <!-- ================= LA MORA BEACH ================= -->
  <g class="doodle" stroke="#3b2f26" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M60,478 q30,-24 60,0 z" fill="#e9cfc4"/><path d="M90,478 v16"/>
    <path d="M150,498 q26,-21 52,0 z" fill="#f2ddd6"/><path d="M176,498 v14"/>
  </g>
  <!-- loungers -->
  <g class="doodle" stroke="#3b2f26" stroke-width="1.3" fill="#fffaf0" stroke-linejoin="round">
    <path d="M108,510 h22 l6,8 h-28 z"/><path d="M112,510 v-8 h16 v8"/>
    <path d="M196,522 h20 l5,7 h-25 z"/>
  </g>
  <text x="132" y="556" class="map-label" text-anchor="middle">LA MORA</text>
  <text x="132" y="572" class="map-label-sm" text-anchor="middle">BEACH</text>

  <!-- ================= CASTELL DE TAMARIT ================= -->
  <a href="#stay-tamarit" class="map-spot" aria-label="Castell de Tamarit, the wedding venue">
    <g class="spot spot-hero">
      <!-- headland / cliff -->
      <path d="M258,412 C262,380 300,356 350,352 C404,348 452,368 462,394
               C456,418 420,428 360,428 C312,428 274,424 258,412 Z"
            fill="#efe4cb" stroke="#3b2f26" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- rocks at the waterline -->
      <g stroke="#3b2f26" stroke-width="1.4" fill="#e4d8be" stroke-linejoin="round">
        <path d="M272,420 l16,-9 l18,7 l-6,10 l-22,1 z"/>
        <path d="M440,404 l14,-8 l16,6 l-5,9 l-19,1 z"/>
      </g>

      <!-- curtain wall -->
      <g stroke="#3b2f26" stroke-width="2" fill="#fffaf0" stroke-linejoin="round">
        <path d="M300,372 v-52 h116 v52"/>
        <path d="M300,320 h8 v-8 h9 v8 h9 v-8 h9 v8 h9 v-8 h9 v8 h9 v-8 h9 v8 h9 v-8 h9 v8 h9 v-8 h9"/>
      </g>
      <!-- left tower -->
      <g stroke="#3b2f26" stroke-width="2" fill="#fffaf0" stroke-linejoin="round">
        <path d="M278,374 v-84 h28 v84"/>
        <path d="M278,290 h8 v-9 h6 v9 h6 v-9 h8 v9"/>
      </g>
      <!-- right tower -->
      <g stroke="#3b2f26" stroke-width="2" fill="#fffaf0" stroke-linejoin="round">
        <path d="M410,372 v-84 h28 v84"/>
        <path d="M410,288 h8 v-9 h6 v9 h6 v-9 h8 v9"/>
      </g>
      <!-- keep -->
      <g stroke="#3b2f26" stroke-width="2" fill="#fffaf0" stroke-linejoin="round">
        <path d="M348,320 v-38 h24 v38"/>
        <path d="M348,282 h6 v-9 h12 v9"/>
      </g>
      <!-- windows -->
      <g stroke="#3b2f26" stroke-width="1.5" fill="none">
        <path d="M288,330 v-12 a5,5 0 0 1 10,0 v12"/>
        <path d="M420,330 v-12 a5,5 0 0 1 10,0 v12"/>
        <rect x="310" y="338" width="7" height="11"/>
        <rect x="332" y="338" width="7" height="11"/>
        <rect x="378" y="338" width="7" height="11"/>
        <rect x="400" y="338" width="7" height="11"/>
        <rect x="356" y="296" width="6" height="9"/>
        <rect x="366" y="296" width="6" height="9"/>
      </g>
      <!-- arched gate -->
      <g stroke="#3b2f26" stroke-width="1.8" fill="#efe4cb">
        <path d="M362,372 v-24 a12,12 0 0 1 24,0 v24 z"/>
      </g>
      <!-- flag -->
      <g stroke="#3b2f26" stroke-width="1.7" fill="#b2564f" stroke-linejoin="round">
        <path d="M360,244 v-30"/>
        <path d="M360,214 l26,9 l-26,10 z"/>
      </g>
      <!-- cypress trees -->
      <g class="doodle" stroke="#4e6b4a" stroke-width="1.5" fill="#c9d9c2" stroke-linejoin="round">
        <path d="M330,368 q-7,-26 6,-46 q13,20 6,46 z"/>
        <path d="M388,366 q-6,-22 5,-38 q11,16 5,38 z"/>
      </g>
      <text x="360" y="196" class="map-label map-label-hero" text-anchor="middle">CASTELL DE TAMARIT</text>
      <text x="360" y="178" class="map-label-sm" text-anchor="middle">THE WEDDING</text>
    </g>
  </a>

  <!-- ================= LES BOTIGUES ================= -->
  <a href="#stay-airbnb" class="map-spot" aria-label="Les Botigues de Mar beach restaurants">
    <g class="spot">
      <!-- fishermen's houses, tightly packed -->
      <g stroke="#3b2f26" stroke-width="1.6" fill="#fffaf0" stroke-linejoin="round">
        <path d="M486,392 v-20 l13,-10 l13,10 v20 z"/>
        <path d="M516,398 v-18 l12,-9 l12,9 v18 z"/>
        <path d="M544,402 v-16 l11,-8 l11,8 v16 z"/>
        <path d="M570,406 v-14 l10,-7 l10,7 v14 z"/>
      </g>
      <g stroke="#3b2f26" stroke-width="1.3" fill="none">
        <path d="M492,384 h6 M510,390 h6 M538,394 h6 M564,398 h6"/>
      </g>
      <!-- parasols on the sand -->
      <g class="doodle" stroke="#3b2f26" stroke-width="1.4" fill="#e9cfc4" stroke-linecap="round">
        <path d="M498,432 q22,-18 44,0 z"/><path d="M520,432 v12" fill="none"/>
        <path d="M556,438 q18,-15 36,0 z" fill="#f2ddd6"/><path d="M574,438 v10" fill="none"/>
      </g>
      <text x="536" y="470" class="map-label-sm" text-anchor="middle">LES BOTIGUES DE MAR</text>
    </g>
  </a>

  <!-- ================= ALTAFULLA OLD TOWN ================= -->
  <a href="#stay-claustre" class="map-spot" aria-label="Altafulla old town and Gran Claustre">
    <g class="spot">
      <!-- hill -->
      <path d="M596,330 C620,296 700,286 748,308 C772,320 782,340 776,356
               C742,372 630,372 598,352 Z"
            fill="#efe4cb" stroke="#3b2f26" stroke-width="1.5" stroke-linejoin="round"/>
      <!-- medieval wall -->
      <g stroke="#3b2f26" stroke-width="1.7" fill="none" stroke-linejoin="round">
        <path d="M614,340 l8,-16 l10,10 l12,-16 l12,12 l14,-14 l12,12 l14,-14 l12,12 l14,-12"/>
      </g>
      <!-- church -->
      <g stroke="#3b2f26" stroke-width="1.9" fill="#fffaf0" stroke-linejoin="round">
        <path d="M660,330 v-44 h44 v44"/>
        <path d="M660,286 l22,-17 l22,17"/>
        <path d="M682,269 v-22"/>
        <path d="M673,247 h18"/>
        <path d="M674,330 v-16 a8,8 0 0 1 16,0 v16"/>
      </g>
      <!-- bell arch -->
      <g stroke="#3b2f26" stroke-width="1.6" fill="none">
        <path d="M700,292 v-14 a8,8 0 0 1 16,0 v14"/>
      </g>
      <!-- clustered old-town roofs -->
      <g stroke="#3b2f26" stroke-width="1.6" fill="#fffaf0" stroke-linejoin="round">
        <path d="M620,344 v-18 l12,-9 l12,9 v18 z"/>
        <path d="M644,350 v-14 l10,-8 l10,8 v14 z"/>
        <path d="M712,338 v-16 l11,-8 l11,8 v16 z"/>
        <path d="M734,346 v-12 l9,-7 l9,7 v12 z"/>
      </g>
      <!-- castle of Altafulla (small) -->
      <g stroke="#3b2f26" stroke-width="1.7" fill="#fffaf0" stroke-linejoin="round">
        <path d="M600,352 v-22 h20 v22"/>
        <path d="M600,330 h5 v-6 h10 v6"/>
      </g>
      <!-- plaza dots -->
      <g fill="#3b2f26" opacity=".5">
        <circle cx="672" cy="352" r="1.8"/><circle cx="682" cy="358" r="1.8"/>
        <circle cx="662" cy="360" r="1.8"/><circle cx="692" cy="350" r="1.8"/>
      </g>
      <text x="688" y="384" class="map-label" text-anchor="middle">ALTAFULLA</text>
      <text x="688" y="400" class="map-label-sm" text-anchor="middle">OLD TOWN · VILA CLOSA</text>
    </g>
  </a>

  <!-- ================= MAY BOUTIQUE ================= -->
  <a href="#stay-may" class="map-spot" aria-label="May Altafulla Beach Boutique Hotel">
    <g class="spot">
      <g stroke="#3b2f26" stroke-width="1.9" fill="#fffaf0" stroke-linejoin="round">
        <path d="M760,342 h56 v-40 h-56 z"/>
        <path d="M760,302 h56"/>
        <path d="M760,302 v-10 h56 v10"/>
        <!-- rooftop terrace rail -->
        <path d="M766,292 v-6 M780,292 v-6 M794,292 v-6 M808,292 v-6"/>
      </g>
      <g stroke="#3b2f26" stroke-width="1.3" fill="none">
        <path d="M767,312 h9 M783,312 h9 M799,312 h9"/>
        <path d="M767,324 h9 M783,324 h9 M799,324 h9"/>
      </g>
      <!-- rooftop umbrella -->
      <g stroke="#3b2f26" stroke-width="1.4" fill="#e9cfc4" stroke-linecap="round">
        <path d="M806,286 q12,-10 24,0 z"/><path d="M818,286 v-6" fill="none"/>
      </g>
      <!-- beach below -->
      <g class="doodle" stroke="#3b2f26" stroke-width="1.4" fill="#f2ddd6" stroke-linecap="round">
        <path d="M756,364 q20,-16 40,0 z"/><path d="M776,364 v12" fill="none"/>
        <path d="M806,372 q16,-13 32,0 z" fill="#e9cfc4"/><path d="M822,372 v10" fill="none"/>
      </g>
      <g class="doodle" stroke="#3b2f26" stroke-width="1.3" fill="#fffaf0" stroke-linejoin="round">
        <path d="M798,382 h18 l5,7 h-23 z"/>
      </g>
      <text x="788" y="404" class="map-label-sm" text-anchor="middle">MAY BOUTIQUE</text>
    </g>
  </a>

  <!-- ================= ALTAFULLA MAR ================= -->
  <a href="#stay-mar" class="map-spot" aria-label="Hotel Altafulla Mar">
    <g class="spot">
      <g stroke="#3b2f26" stroke-width="1.9" fill="#fffaf0" stroke-linejoin="round">
        <path d="M624,398 h62 v-44 h-62 z"/>
        <path d="M624,354 h62"/>
        <path d="M624,354 v-10 h62 v10"/>
      </g>
      <g stroke="#3b2f26" stroke-width="1.3" fill="none">
        <path d="M632,364 h10 M648,364 h10 M664,364 h10"/>
        <path d="M632,378 h10 M648,378 h10 M664,378 h10"/>
        <path d="M650,398 v-12 h10 v12"/>
      </g>
      <!-- pool -->
      <g stroke="#7ea39d" stroke-width="1.6" fill="#dcebe7">
        <rect x="624" y="404" width="62" height="18" rx="9"/>
      </g>
      <g stroke="#7ea39d" stroke-width="1.3" fill="none" stroke-linecap="round">
        <path d="M634,413 q8,-5 16,0 q8,5 16,0"/>
      </g>
      <!-- palm -->
      <g class="doodle" stroke="#4e6b4a" stroke-width="1.5" fill="none" stroke-linecap="round">
        <path d="M700,400 v-26"/>
        <path d="M700,374 q-14,-10 -20,-2 M700,374 q14,-10 20,-2 M700,376 q-8,-14 -2,-19 M700,376 q8,-14 2,-19"/>
      </g>
      <text x="655" y="440" class="map-label-sm" text-anchor="middle">ALTAFULLA MAR</text>
    </g>
  </a>

  <!-- ================= TRAIN STATION ================= -->
  <g class="doodle" stroke="#3b2f26" stroke-width="1.5" fill="none" stroke-linejoin="round">
    <path d="M470,300 h74" stroke-dasharray="4 5"/>
    <rect x="478" y="308" width="56" height="18" fill="#fffaf0"/>
    <path d="M478,308 l28,-12 l28,12"/>
    <path d="M496,326 v-10 h10 v10"/>
  </g>
  <text x="506" y="342" class="map-label-sm" text-anchor="middle">ALTAFULLA-TAMARIT</text>
  <text x="506" y="354" class="map-label-sm" text-anchor="middle" opacity=".7">TRAIN</text>

  <!-- ================= SUN ================= -->
  <g class="doodle" stroke="#c08a3e" stroke-width="1.8" fill="none" stroke-linecap="round">
    <circle cx="104" cy="122" r="26" fill="#f9eed6"/>
    <path d="M104,82 v-16 M104,162 v16 M64,122 h-16 M144,122 h16
             M76,94 l-11,-11 M132,150 l11,11 M132,94 l11,-11 M76,150 l-11,11"/>
    <path d="M93,127 q11,10 22,0"/>
    <circle cx="95" cy="115" r="2" fill="#c08a3e"/>
    <circle cx="114" cy="115" r="2" fill="#c08a3e"/>
  </g>
  <!-- clouds -->
  <g class="doodle" stroke="#a08d70" stroke-width="1.4" fill="#fffaf0" stroke-linecap="round">
    <path d="M214,110 q6,-14 22,-9 q6,-12 22,-6 q14,-3 14,10 q0,7 -10,7 h-40 q-9,0 -8,-2 z"/>
    <path d="M330,74 q5,-11 18,-7 q5,-10 18,-5 q11,-2 11,8 q0,6 -8,6 h-33 q-7,0 -6,-2 z"/>
  </g>
  <!-- birds -->
  <g class="doodle" stroke="#3b2f26" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".7">
    <path d="M246,168 q11,-9 22,0"/>
    <path d="M282,148 q9,-7 18,0"/>
    <path d="M196,196 q8,-7 16,0"/>
    <path d="M620,120 q9,-7 18,0"/>
    <path d="M660,100 q8,-6 16,0"/>
  </g>

  <!-- ================= COMPASS ================= -->
  <g class="doodle" stroke="#3b2f26" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".85">
    <circle cx="80" cy="620" r="30"/>
    <circle cx="80" cy="620" r="21" opacity=".4"/>
    <path d="M80,594 l8,26 l-8,-7 l-8,7 z" fill="#3b2f26"/>
    <text x="80" y="584" class="map-label-sm" text-anchor="middle">N</text>
  </g>

  <text x="18" y="764" class="map-arrow-sm">Tap a place for details</text>
</svg>
