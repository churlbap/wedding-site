<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520">
  <defs>
    <g id="petal">
      <!-- lanceolate petal, wavy margins, cream fill + rose veining -->
      <path d="M0 0 C-9 -14 -13 -30 -9 -46 C-6 -58 -3 -66 0 -74 C3 -66 6 -58 9 -46 C13 -30 9 -14 0 0 Z"
            fill="#ecd2c2" stroke="#cf8d8a" stroke-width="1.1"/>
      <g stroke="#cf8d8a" stroke-width=".55" opacity=".75" fill="none">
        <path d="M-4 -6 C-7 -20 -7 -38 -4 -56"/>
        <path d="M0 -4 C0 -20 0 -40 0 -62"/>
        <path d="M4 -6 C7 -20 7 -38 4 -56"/>
        <path d="M-6.5 -8 C-9 -22 -9 -34 -7 -46"/>
        <path d="M6.5 -8 C9 -22 9 -34 7 -46"/>
      </g>
    </g>

    <g id="leaf">
      <!-- wavy oblong leaf: olive fill, dark outline -->
      <path d="M0 0 C10 -14 24 -22 38 -24 C50 -25 60 -20 66 -12 C60 -4 50 2 38 4 C24 6 10 6 0 0 Z"
            fill="#9c9a4c" stroke="#2f4a1e" stroke-width="1.2"/>
    </g>

    <g id="speck">
      <g fill="#2f4a1e" opacity=".55">
        <rect x="4" y="-4" width="2.6" height="1.1" transform="rotate(18)"/>
        <rect x="14" y="-9" width="2.4" height="1.1" transform="rotate(-12)"/>
        <rect x="22" y="-14" width="2.8" height="1.1" transform="rotate(24)"/>
        <rect x="31" y="-17" width="2.2" height="1.1" transform="rotate(-6)"/>
        <rect x="40" y="-18" width="2.6" height="1.1" transform="rotate(14)"/>
        <rect x="48" y="-16" width="2.2" height="1.1" transform="rotate(-20)"/>
        <rect x="10" y="0" width="2.4" height="1.1" transform="rotate(8)"/>
        <rect x="19" y="-4" width="2.6" height="1.1" transform="rotate(-16)"/>
        <rect x="28" y="-8" width="2.2" height="1.1" transform="rotate(20)"/>
        <rect x="37" y="-10" width="2.6" height="1.1" transform="rotate(-8)"/>
        <rect x="45" y="-9" width="2.2" height="1.1" transform="rotate(12)"/>
        <rect x="54" y="-6" width="2.4" height="1.1" transform="rotate(-14)"/>
        <rect x="16" y="-15" width="2.0" height="1.1" transform="rotate(30)"/>
        <rect x="33" y="-13" width="2.0" height="1.1" transform="rotate(-24)"/>
      </g>
    </g>

    <g id="openflower">
      <!-- ochre throat behind petals -->
      <circle r="9" fill="#e2a93f" opacity=".85"/>
      <!-- six petals radiating -->
      <g>
        <use href="#petal" transform="rotate(-62)"/>
        <use href="#petal" transform="rotate(-20)"/>
        <use href="#petal" transform="rotate(20)"/>
        <use href="#petal" transform="rotate(62)"/>
        <use href="#petal" transform="rotate(146)"/>
        <use href="#petal" transform="rotate(198)"/>
      </g>
      <!-- stamens -->
      <g stroke="#2f4a1e" stroke-width="1.1" fill="none" stroke-linecap="round">
        <path d="M0 4 C-4 16 -9 24 -13 31"/>
        <path d="M0 4 C0 17 0 26 1 34"/>
        <path d="M0 4 C4 16 9 24 13 30"/>
        <path d="M0 4 C-8 13 -15 18 -21 22"/>
        <path d="M0 4 C8 13 15 18 20 21"/>
      </g>
      <g fill="#e2a93f">
        <circle cx="-13" cy="32" r="2.6"/>
        <circle cx="1" cy="35" r="2.6"/>
        <circle cx="13" cy="31" r="2.6"/>
        <circle cx="-22" cy="23" r="2.4"/>
        <circle cx="21" cy="22" r="2.4"/>
      </g>
      <!-- sepals at base -->
      <g fill="#2f4a1e">
        <path d="M-7 2 C-10 8 -8 13 -5 12 C-3 9 -4 5 -7 2 Z"/>
        <path d="M7 2 C10 8 8 13 5 12 C3 9 4 5 7 2 Z"/>
      </g>
    </g>

    <g id="bud">
      <!-- drooping closed lily: teardrop, overlapping petals -->
      <path d="M0 0 C-11 8 -15 24 -12 40 C-10 52 -5 62 0 70 C5 62 10 52 12 40 C15 24 11 8 0 0 Z"
            fill="#ecd2c2" stroke="#cf8d8a" stroke-width="1.1"/>
      <g stroke="#cf8d8a" stroke-width=".55" opacity=".7" fill="none">
        <path d="M-4 6 C-8 22 -8 42 -5 58"/>
        <path d="M0 4 C0 24 0 46 0 64"/>
        <path d="M4 6 C8 22 8 42 5 58"/>
      </g>
      <!-- ochre stripe down front petal -->
      <path d="M0 10 C-1.6 28 -1.6 46 0 62 C1.6 46 1.6 28 0 10 Z" fill="#e2a93f" opacity=".45"/>
      <!-- separating petal lines at the base -->
      <g stroke="#cf8d8a" stroke-width="1" fill="none">
        <path d="M-12 40 C-7 44 -3 47 0 52"/>
        <path d="M12 40 C7 44 3 47 0 52"/>
      </g>
      <!-- calyx -->
      <g fill="#2f4a1e">
        <path d="M-6 -1 C-11 2 -13 8 -10 9 C-7 7 -5 3 -6 -1 Z"/>
        <path d="M6 -1 C11 2 13 8 10 9 C7 7 5 3 6 -1 Z"/>
        <path d="M0 -3 C-2 1 -1 6 1 6 C3 4 3 0 0 -3 Z"/>
      </g>
    </g>
  </defs>

  <!-- ============ TILE CONTENTS ============ -->
  <!-- stems first (behind) -->
  <g stroke="#2f4a1e" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M150 300 C142 268 138 236 140 206 C142 178 150 154 160 134"/>
    <path d="M140 206 C118 196 100 190 84 190"/>
    <path d="M160 134 C156 116 150 104 142 96"/>
    <path d="M150 300 C156 330 164 352 176 368"/>
    <path d="M330 200 C338 230 344 262 342 292"/>
    <path d="M342 292 C362 300 380 304 396 302"/>
  </g>

  <!-- leaves -->
  <g>
    <use href="#leaf" transform="translate(96 214) rotate(-24)"/>
    <use href="#speck" transform="translate(96 214) rotate(-24)"/>
    <use href="#leaf" transform="translate(162 210) rotate(28) scale(.92)"/>
    <use href="#speck" transform="translate(162 210) rotate(28) scale(.92)"/>
    <use href="#leaf" transform="translate(120 300) rotate(186) scale(.88)"/>
    <use href="#speck" transform="translate(120 300) rotate(186) scale(.88)"/>
    <use href="#leaf" transform="translate(352 268) rotate(-8) scale(.8)"/>
    <use href="#speck" transform="translate(352 268) rotate(-8) scale(.8)"/>
  </g>

  <!-- open lily -->
  <g transform="translate(150 128) scale(1.15) rotate(-6)">
    <use href="#openflower"/>
  </g>

  <!-- drooping bud -->
  <g transform="translate(142 96) rotate(148) scale(.9)">
    <use href="#bud"/>
  </g>

  <!-- second smaller bloom, right -->
  <g transform="translate(340 196) scale(.78) rotate(14)">
    <use href="#openflower"/>
  </g>

  <!-- small bud bottom -->
  <g transform="translate(178 372) rotate(160) scale(.62)">
    <use href="#bud"/>
  </g>

  <!-- scattered buds -->
  <g opacity=".85">
    <g transform="translate(430 400) rotate(20) scale(.5)"><use href="#bud"/></g>
    <g transform="translate(60 420) rotate(-28) scale(.44)"><use href="#bud"/></g>
  </g>
</svg>
