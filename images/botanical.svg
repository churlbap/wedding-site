    <g class="bud"><circle cx="0" cy="-2" r="2.4"/></g>
    <g>
      <path class="leaf-fill" d="M4 36 C26 32 44 42 50 58 C34 62 12 52 4 36 Z"/>
      <path class="leaf" d="M4 36 C26 32 44 42 50 58 C34 62 12 52 4 36 Z"/>
      <path class="leaf" d="M4 36 C24 42 38 50 50 58" stroke-width="1"/>
      <path class="leaf-fill" d="M2 62 C-18 58 -36 66 -44 80 C-28 86 -6 78 2 62 Z"/>
      <path class="leaf" d="M2 62 C-18 58 -36 66 -44 80 C-28 86 -6 78 2 62 Z"/>
      <path class="leaf" d="M2 62 C-16 68 -32 74 -44 80" stroke-width="1"/>
    </g>
  </g>

  <!-- small scattered sprig top right -->
  <g transform="translate(340 76) rotate(34) scale(0.55)" opacity=".85">
