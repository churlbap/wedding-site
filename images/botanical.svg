      <path d="M0 0 C-12 -1 -23 -4 -23 -13 C-20 -22 -6 -16 0 0 Z"/>
    </g>
    <g>
      <path class="leaf-fill" d="M-2 26 C-16 23 -27 30 -31 41 C-21 44 -7 37 -2 26 Z"/>
      <path class="leaf" d="M-2 26 C-16 23 -27 30 -31 41 C-21 44 -7 37 -2 26 Z"/>
    </g>
  </g>

  <!-- scatter buds bottom left -->
  <g opacity=".55">
    <circle class="bud" cx="60" cy="330" r="3.4"/>
    <circle class="bud" cx="78" cy="352" r="2.2"/>
    <circle class="bud" cx="42" cy="356" r="2.6"/>
    <path class="stem" d="M60 330 C62 344 66 352 72 358" stroke-width="1.2"/>
