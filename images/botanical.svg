<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <style>
      .petal { fill: none; stroke: #f6e7cf; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .petal-fill { fill: #f3dcc0; opacity: .22; }
      .leaf { fill: none; stroke: #8a9166; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .leaf-fill { fill: #8a9166; opacity: .16; }
      .stem { fill: none; stroke: #9aa079; stroke-width: 1.7; stroke-linecap: round; }
      .bud { fill: #e9c9a4; opacity: .5; }
    </style>
  </defs>

  <!-- main lily sprig, upper left -->
  <g transform="translate(96 92) rotate(-14)">
    <path class="stem" d="M0 0 C2 34 -3 62 -6 96"/>
    <g class="petal-fill">
      <path d="M0 0 C-14 -12 -26 -26 -20 -40 C-12 -50 2 -40 0 0 Z"/>
      <path d="M0 0 C-4 -22 -2 -44 8 -52 C18 -46 14 -22 0 0 Z"/>
      <path d="M0 0 C10 -14 26 -24 34 -14 C38 -2 20 4 0 0 Z"/>
      <path d="M0 0 C-16 -2 -32 -6 -32 -18 C-28 -30 -8 -22 0 0 Z"/>
      <path d="M0 0 C8 8 14 24 4 30 C-6 32 -8 12 0 0 Z"/>
    </g>
    <g class="petal">
      <path d="M0 0 C-14 -12 -26 -26 -20 -40 C-12 -50 2 -40 0 0 Z"/>
      <path d="M0 0 C-4 -22 -2 -44 8 -52 C18 -46 14 -22 0 0 Z"/>
      <path d="M0 0 C10 -14 26 -24 34 -14 C38 -2 20 4 0 0 Z"/>
      <path d="M0 0 C-16 -2 -32 -6 -32 -18 C-28 -30 -8 -22 0 0 Z"/>
      <path d="M0 0 C8 8 14 24 4 30 C-6 32 -8 12 0 0 Z"/>
      <path d="M0 0 C-2 -8 4 -14 10 -10" stroke-width="1.3"/>
      <path d="M0 0 C-8 2 -12 10 -6 14" stroke-width="1.3"/>
      <path d="M0 0 C6 -4 12 -2 14 4" stroke-width="1.3"/>
    </g>
    <g class="bud">
      <circle cx="0" cy="-2" r="2.6"/>
    </g>
    <g>
      <path class="leaf-fill" d="M-4 34 C-26 30 -44 40 -50 56 C-34 60 -12 50 -4 34 Z"/>
      <path class="leaf" d="M-4 34 C-26 30 -44 40 -50 56 C-34 60 -12 50 -4 34 Z"/>
      <path class="leaf" d="M-4 34 C-24 40 -38 48 -50 56" stroke-width="1"/>
      <path class="leaf-fill" d="M-2 58 C18 54 36 62 44 76 C28 82 6 74 -2 58 Z"/>
      <path class="leaf" d="M-2 58 C18 54 36 62 44 76 C28 82 6 74 -2 58 Z"/>
      <path class="leaf" d="M-2 58 C16 64 32 70 44 76" stroke-width="1"/>
