  <!-- second sprig, right side, flipped and smaller -->
  <g transform="translate(316 250) rotate(18) scale(0.82)">
    <path class="stem" d="M0 0 C-2 34 3 62 6 92"/>
    <g class="petal-fill">
      <path d="M0 0 C14 -12 26 -26 20 -40 C12 -50 -2 -40 0 0 Z"/>
      <path d="M0 0 C4 -22 2 -44 -8 -52 C-18 -46 -14 -22 0 0 Z"/>
      <path d="M0 0 C-10 -14 -26 -24 -34 -14 C-38 -2 -20 4 0 0 Z"/>
      <path d="M0 0 C16 -2 32 -6 32 -18 C28 -30 8 -22 0 0 Z"/>
      <path d="M0 0 C-8 8 -14 24 -4 30 C6 32 8 12 0 0 Z"/>
