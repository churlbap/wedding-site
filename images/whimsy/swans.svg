<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf8"/><stop offset="100%" stop-color="#eadfc9"/>
    </linearGradient>
    <linearGradient id="wt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b9d0c9" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#7ea39d" stop-opacity=".25"/>
    </linearGradient>
  </defs>
  <!-- water -->
  <ellipse cx="150" cy="158" rx="128" ry="26" fill="url(#wt)"/>
  <path d="M34,158 q26,-7 52,0 M214,158 q26,-7 52,0" fill="none" stroke="#7ea39d" stroke-width="1.4" opacity=".5"/>
  <!-- left swan -->
  <g>
    <path d="M118,150 q-4,-26 14,-38 q14,-10 22,-2 q6,6 -2,10 q-12,5 -16,16 q-2,8 4,14 z" fill="url(#sw)" stroke="#8a7a62" stroke-width="1.3"/>
    <path d="M152,112 q10,-16 4,-26 q-4,-8 -12,-6 q-7,2 -5,9 q2,6 8,5" fill="url(#sw)" stroke="#8a7a62" stroke-width="1.3"/>
    <path d="M139,90 q-8,1 -11,6 q6,3 11,1" fill="#c08a3e" stroke="#8a7a62" stroke-width="1"/>
    <circle cx="143" cy="85" r="1.3" fill="#3b2f26"/>
  </g>
  <!-- right swan mirrored -->
  <g transform="translate(300,0) scale(-1,1)">
    <path d="M118,150 q-4,-26 14,-38 q14,-10 22,-2 q6,6 -2,10 q-12,5 -16,16 q-2,8 4,14 z" fill="url(#sw)" stroke="#8a7a62" stroke-width="1.3"/>
    <path d="M152,112 q10,-16 4,-26 q-4,-8 -12,-6 q-7,2 -5,9 q2,6 8,5" fill="url(#sw)" stroke="#8a7a62" stroke-width="1.3"/>
    <path d="M139,90 q-8,1 -11,6 q6,3 11,1" fill="#c08a3e" stroke="#8a7a62" stroke-width="1"/>
    <circle cx="143" cy="85" r="1.3" fill="#3b2f26"/>
  </g>
  <!-- heart -->
  <path d="M150,84 q-5,-9 -12,-5 q-8,5 2,16 l10,9 l10,-9 q10,-11 2,-16 q-7,-4 -12,5 z" fill="#c98d8d" opacity=".55"/>
</svg>
